name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  predeploy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.sha.outputs.base_sha }}
      head_sha: ${{ steps.sha.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Compute push SHAs
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "base_sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run predeploy guard
        env:
          BASE_SHA: ${{ steps.sha.outputs.base_sha }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
          LOG_DIR: ./artifacts/predeploy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/ci/predeploy-guard.sh
          ./scripts/ci/predeploy-guard.sh

      - name: Upload predeploy logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: predeploy-guard-logs
          path: artifacts/predeploy
          if-no-files-found: warn

  deploy:
    needs: predeploy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          cat > ~/.ssh/id_ed25519 << 'KEY'
          ${{ secrets.DEPLOY_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_ALLOW_DB_PUSH_FALLBACK: ${{ secrets.DEPLOY_ALLOW_DB_PUSH_FALLBACK }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "EXPECTED_SHA=$EXPECTED_SHA bash -se" << 'EOF'
          set -euo pipefail
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/github_pull_ci_ed25519 -o IdentitiesOnly=yes'

          echo "[deploy] expected commit: $EXPECTED_SHA"
          cd /opt/apps/travel-planner
          echo "[deploy] current commit before update: $(git rev-parse HEAD)"
          git fetch origin main
          git reset --hard origin/main
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "[deploy] current commit after update: $CURRENT_SHA"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "[deploy][error] commit mismatch: expected=$EXPECTED_SHA actual=$CURRENT_SHA"
            exit 1
          fi

          echo "[deploy] docker services"
          docker compose -f docker-compose.prod.yml config --services

          echo "[deploy][step] docker build (single pass) started"
          docker compose -f docker-compose.prod.yml build api web nginx
          echo "[deploy][step] docker build (single pass) finished"

          echo "[deploy] ensure db is running before backup"
          docker compose -f docker-compose.prod.yml up -d db
          docker compose -f docker-compose.prod.yml ps db
          docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

          echo "[deploy] start db backup"
          mkdir -p /opt/apps/travel-planner/backups
          BACKUP_FILE="/opt/apps/travel-planner/backups/db_$(date +%Y%m%d_%H%M%S).sql"
          if docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$BACKUP_FILE"; then
            echo "[deploy] db backup saved to: $BACKUP_FILE"
          else
            echo "[deploy][warn] db backup failed, continue deploy"
          fi

          echo "[deploy][step] preflight db structure started"
          docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "\\d+ public.trips"' || true
          docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "\\d+ public.route_points"' || true
          if ! docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT * FROM __drizzle_migrations ORDER BY id;"'; then
            echo "[deploy][warn] __drizzle_migrations table is missing"
          fi
          echo "[deploy][step] preflight db structure finished"

          echo "[deploy][step] db:migrate started"
          MIGRATE_LOG="/tmp/deploy_db_migrate.log"
          rm -f "$MIGRATE_LOG"
          if COREPACK_ENABLE_DOWNLOAD_PROMPT=0 docker compose -f docker-compose.prod.yml run --rm -T --no-deps api pnpm --filter api db:migrate < /dev/null 2>&1 | tee "$MIGRATE_LOG"; then
            echo "[deploy][step] db:migrate finished"
          else
            echo "[deploy][error] db:migrate failed"
            echo "[debug] available migration files"
            docker compose -f docker-compose.prod.yml run --rm -T --no-deps api sh -lc 'ls -lah apps/api/src/db/migrations || true; ls -lah apps/api/src/db/migrations/meta || true; cat apps/api/src/db/migrations/meta/_journal.json || true' < /dev/null || true

            if grep -Eqi "already exists|code: '42710'|DuplicateObject|relation .* already exists" "$MIGRATE_LOG"; then
              echo "[deploy][warn] detected legacy baseline conflict, enabling controlled db:push fallback"
              if COREPACK_ENABLE_DOWNLOAD_PROMPT=0 docker compose -f docker-compose.prod.yml run --rm -T --no-deps api pnpm --filter api db:push --force < /dev/null; then
                echo "[deploy][warn] fallback db:push finished"
              else
                echo "[deploy][error] fallback db:push failed"
                exit 1
              fi
            elif [ "${DEPLOY_ALLOW_DB_PUSH_FALLBACK:-false}" = "true" ]; then
              echo "[deploy][warn] fallback enabled: running db:push --force"
              if COREPACK_ENABLE_DOWNLOAD_PROMPT=0 docker compose -f docker-compose.prod.yml run --rm -T --no-deps api pnpm --filter api db:push --force < /dev/null; then
                echo "[deploy][warn] fallback db:push finished"
              else
                echo "[deploy][error] fallback db:push failed"
                exit 1
              fi
            else
              echo "[deploy][error] fallback disabled: set secret DEPLOY_ALLOW_DB_PUSH_FALLBACK=true only for emergency"
              exit 1
            fi
          fi

          echo "[deploy][step] schema preflight started"
          docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT table_name, column_name, data_type, is_nullable FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name IN ('\''trips'\'','\''route_points'\'') ORDER BY table_name, ordinal_position;"'
          docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT typname FROM pg_type WHERE typnamespace = '\''public'\''::regnamespace AND typname IN ('\''collaborator_role'\'','\''transport_mode'\'','\''poi_category'\'') ORDER BY typname;"'

          echo "[deploy][step] schema contract verification started"
          SCHEMA_MISSING="$(docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -t -A -c "WITH required(table_name, column_name) AS ( VALUES ('\''trips'\'','\''id'\''),('\''trips'\'','\''title'\''),('\''trips'\'','\''description'\''),('\''trips'\'','\''budget'\''),('\''trips'\'','\''owner_id'\''),('\''trips'\'','\''is_active'\''),('\''trips'\'','\''is_predefined'\''),('\''trips'\'','\''img'\''),('\''trips'\'','\''tags'\''),('\''trips'\'','\''temp'\''),('\''trips'\'','\''start_date'\''),('\''trips'\'','\''end_date'\''),('\''trips'\'','\''version'\''),('\''trips'\'','\''distance_km'\''),('\''trips'\'','\''created_at'\''),('\''trips'\'','\''updated_at'\''),('\''route_points'\'','\''id'\''),('\''route_points'\'','\''trip_id'\''),('\''route_points'\'','\''title'\''),('\''route_points'\'','\''description'\''),('\''route_points'\'','\''lat'\''),('\''route_points'\'','\''lon'\''),('\''route_points'\'','\''budget'\''),('\''route_points'\'','\''visit_date'\''),('\''route_points'\'','\''image_url'\''),('\''route_points'\'','\''order'\''),('\''route_points'\'','\''address'\''),('\''route_points'\'','\''transport_mode'\''),('\''route_points'\'','\''duration'\''),('\''route_points'\'','\''is_title_locked'\''),('\''route_points'\'','\''created_at'\'') ) SELECT r.table_name || '\''.'\'' || r.column_name FROM required r LEFT JOIN information_schema.columns c ON c.table_schema = '\''public'\'' AND c.table_name = r.table_name AND c.column_name = r.column_name WHERE c.column_name IS NULL ORDER BY r.table_name, r.column_name;"')"
          if [ -n "$SCHEMA_MISSING" ]; then
            echo "[deploy][error] schema contract check failed — missing columns:"
            echo "$SCHEMA_MISSING"
            exit 1
          else
            echo "[deploy][step] schema contract verification finished"
          fi

          echo "[deploy][step] db:seed started"
          if COREPACK_ENABLE_DOWNLOAD_PROMPT=0 docker compose -f docker-compose.prod.yml run --rm -T --no-deps api pnpm --filter api db:seed < /dev/null; then
            echo "[deploy][step] db:seed finished"
          else
            echo "[deploy][error] db:seed failed"
            echo "[debug] seed failed schema snapshot (trips + route_points)"
            docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT table_name, column_name, data_type, is_nullable FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name IN ('\''trips'\'','\''route_points'\'') ORDER BY table_name, ordinal_position;"' || true
            echo "[debug] db-seed logs"
            docker compose -f docker-compose.prod.yml logs --no-color --tail=200 db-seed || true
            exit 1
          fi

          echo "[deploy][step] schema log started"
          if docker compose -f docker-compose.prod.yml exec --interactive=false -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT c.table_name, c.column_name, c.data_type, c.is_nullable FROM information_schema.columns AS c WHERE c.table_schema = '\''public'\'' ORDER BY c.table_name, c.ordinal_position;"'; then
            echo "[deploy][step] schema log finished"
          else
            echo "[deploy][warn] schema log failed, continue deploy"
          fi

          echo "[deploy][step] docker up started"
          if ! docker compose -f docker-compose.prod.yml up -d --wait; then
            echo "[deploy][error] docker up failed — extended diagnostics"
            echo "[debug] compose ps"
            docker compose -f docker-compose.prod.yml ps || true
            echo "[debug] api logs"
            docker compose -f docker-compose.prod.yml logs --no-color --tail=200 api || true
            echo "[debug] nginx logs"
            docker compose -f docker-compose.prod.yml logs --no-color --tail=120 nginx || true
            echo "[debug] api inspect summary"
            docker inspect travel-planner-api --format "name={{.Name}} state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}" || true
            echo "[debug] api health log"
            docker inspect travel-planner-api | python3 -c "import sys,json;d=json.load(sys.stdin)[0];h=d.get('State',{}).get('Health',{});print('health=',h.get('Status'));[print((x.get('Start','')+' '+x.get('ExitCode','').__str__()+': '+x.get('Output','')).strip()) for x in h.get('Log',[])]" || true
            exit 1
          fi
          echo "[deploy][step] docker up finished"

          echo "[deploy][step] test nginx routing to API"
          if ! curl -s -f -k -H "Host: tuda.pro" -o /dev/null https://127.0.0.1/api/trips/predefined; then
            echo "[deploy][error] Nginx to API routing failed (HTTP error code received)"
            exit 1
          fi

          echo "[deploy][step] test nginx routing to Web"
          if ! curl -s -f -k -H "Host: tuda.pro" -o /dev/null https://127.0.0.1/; then
            echo "[deploy][error] Nginx to Web routing failed (HTTP error code received)"
            exit 1
          fi

          echo "[deploy] docker images"
          docker compose -f docker-compose.prod.yml images
          echo "[deploy] docker status"
          docker compose -f docker-compose.prod.yml ps
          echo "[deploy][done] all deploy steps completed"
          EOF
